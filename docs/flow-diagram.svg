<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1740" viewBox="0 0 1500 1740" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b71c1c"/></marker></defs>
<rect width="1500" height="2600" fill="#ffffff"/>
<text x="80" y="60" font-size="30" fill="#1a1c22" text-anchor="start" font-weight="700" font-family="Segoe UI, Arial, sans-serif">HOW THE APP WORKS</text>
<text x="80" y="92" font-size="16" fill="#b71c1c" text-anchor="start" font-weight="700" font-family="Segoe UI, Arial, sans-serif">From your click to the page you see - in seven steps. No programming knowledge needed.</text>
<text x="80" y="116" font-size="13.5" fill="#5a5e6a" text-anchor="start" font-weight="400" font-family="Segoe UI, Arial, sans-serif">Dark chips are real file names; the CAST at the bottom maps nicknames to real files.</text>
<rect x="80" y="150" width="1340" height="128" rx="12" fill="#ffffff" stroke="#d8d8dc" stroke-width="1.4"/>
<rect x="92" y="150" width="1316" height="7" rx="3.5" fill="#1a1c22"/>
<circle cx="120" cy="196" r="17" fill="#1a1c22"/>
<text x="120" y="202" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="150" y="203" font-size="22" fill="#1a1c22" text-anchor="start" font-weight="700" font-family="Segoe UI, Arial, sans-serif">YOU</text>
<text x="150" y="233" font-size="15" fill="#3c3f47" text-anchor="start" font-weight="400" font-family="Segoe UI, Arial, sans-serif">You open the app in any browser and click a link or button.</text>
<text x="150" y="256" font-size="15" fill="#3c3f47" text-anchor="start" font-weight="400" font-family="Segoe UI, Arial, sans-serif">Nothing to install on your machine.</text>
<rect x="150" y="215" width="120.0" height="28" rx="6" fill="#f2f3f6" stroke="#1a1c22" stroke-opacity="0.25"/>
<text x="162" y="235" font-size="13" fill="#1a1c22" font-family="Consolas, monospace">your browser</text>
<line x1="750.0" y1="282" x2="750.0" y2="322" stroke="#b71c1c" stroke-width="2.6" marker-end="url(#arr)"/>
<rect x="80" y="334" width="1340" height="152" rx="12" fill="#ffffff" stroke="#d8d8dc" stroke-width="1.4"/>
<rect x="92" y="334" width="1316" height="7" rx="3.5" fill="#b71c1c"/>
<circle cx="120" cy="380" r="17" fill="#b71c1c"/>
<text x="120" y="386" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="150" y="387" font-size="22" fill="#1a1c22" text-anchor="start" font-weight="700" font-family="Segoe UI, Arial, sans-serif">THE FRONT DESK</text>
<text x="150" y="417" font-size="15" fill="#3c3f47" text-anchor="start" font-weight="400" font-family="Segoe UI, Arial, sans-serif">Greets every visitor - one thread each, so nobody waits behind anybody.</text>
<text x="150" y="440" font-size="15" fill="#3c3f47" text-anchor="start" font-weight="400" font-family="Segoe UI, Arial, sans-serif">If you are not logged in yet, it sends you to the login page first.</text>
<rect x="150" y="423" width="160.0" height="28" rx="6" fill="#f2f3f6" stroke="#1a1c22" stroke-opacity="0.25"/>
<text x="162" y="443" font-size="13" fill="#1a1c22" font-family="Consolas, monospace">backend/server.py</text>
<line x1="750.0" y1="490" x2="750.0" y2="530" stroke="#b71c1c" stroke-width="2.6" marker-end="url(#arr)"/>
<rect x="80" y="542" width="1340" height="152" rx="12" fill="#ffffff" stroke="#d8d8dc" stroke-width="1.4"/>
<rect x="92" y="542" width="1316" height="7" rx="3.5" fill="#1a1c22"/>
<circle cx="120" cy="588" r="17" fill="#1a1c22"/>
<text x="120" y="594" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="150" y="595" font-size="22" fill="#1a1c22" text-anchor="start" font-weight="700" font-family="Segoe UI, Arial, sans-serif">THE SORTING OFFICE</text>
<text x="150" y="625" font-size="15" fill="#3c3f47" text-anchor="start" font-weight="400" font-family="Segoe UI, Arial, sans-serif">Reads the address of your click (the part of the URL after /) and picks</text>
<text x="150" y="648" font-size="15" fill="#3c3f47" text-anchor="start" font-weight="400" font-family="Segoe UI, Arial, sans-serif">the ONE page builder for it - 40 kinds of pages are registered.</text>
<rect x="150" y="631" width="224.0" height="28" rx="6" fill="#f2f3f6" stroke="#1a1c22" stroke-opacity="0.25"/>
<text x="162" y="651" font-size="13" fill="#1a1c22" font-family="Consolas, monospace">backend/routes/helpers.py</text>
<path d="M 750.0,700 Q 750.0,726 427.5,730 L 402.5,734" fill="none" stroke="#b71c1c" stroke-width="2.4" marker-end="url(#arr)"/>
<path d="M 750.0,700 Q 750.0,726 1072.5,730 L 1097.5,734" fill="none" stroke="#b71c1c" stroke-width="2.4" marker-end="url(#arr)"/>
<text x="417.5" y="722" font-size="14" fill="#b71c1c" text-anchor="end" font-weight="700" font-family="Segoe UI, Arial, sans-serif">facts?</text>
<text x="1082.5" y="722" font-size="14" fill="#b71c1c" text-anchor="start" font-weight="700" font-family="Segoe UI, Arial, sans-serif">math?</text>
<rect x="80" y="744" width="645.0" height="190" rx="12" fill="#ffffff" stroke="#d8d8dc" stroke-width="1.4"/>
<rect x="92" y="744" width="621.0" height="7" rx="3.5" fill="#b71c1c"/>
<circle cx="120" cy="790" r="17" fill="#b71c1c"/>
<text x="120" y="796" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
<text x="150" y="797" font-size="20" fill="#1a1c22" text-anchor="start" font-weight="700" font-family="Segoe UI, Arial, sans-serif">THE FILING CABINET</text>
<text x="150" y="824" font-size="15" fill="#3c3f47" text-anchor="start" font-weight="400" font-family="Segoe UI, Arial, sans-serif">Holds every fact in 11 labeled drawers:</text>
<text x="150" y="847" font-size="15" fill="#3c3f47" text-anchor="start" font-weight="400" font-family="Segoe UI, Arial, sans-serif">students, courses, marks, attendance, grades,</text>
<text x="150" y="870" font-size="15" fill="#3c3f47" text-anchor="start" font-weight="400" font-family="Segoe UI, Arial, sans-serif">even the announcement boards and their files.</text>
<text x="150" y="893" font-size="15" fill="#3c3f47" text-anchor="start" font-weight="400" font-family="Segoe UI, Arial, sans-serif">Builders only ASK - they never rummage.</text>
<rect x="150" y="871" width="240.0" height="28" rx="6" fill="#f2f3f6" stroke="#1a1c22" stroke-opacity="0.25"/>
<text x="162" y="891" font-size="13" fill="#1a1c22" font-family="Consolas, monospace">MySQL - via backend/models/</text>
<rect x="775.0" y="744" width="645.0" height="190" rx="12" fill="#ffffff" stroke="#d8d8dc" stroke-width="1.4"/>
<rect x="787.0" y="744" width="621.0" height="7" rx="3.5" fill="#1a1c22"/>
<circle cx="815.0" cy="790" r="17" fill="#1a1c22"/>
<text x="815.0" y="796" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
<text x="845.0" y="797" font-size="20" fill="#1a1c22" text-anchor="start" font-weight="700" font-family="Segoe UI, Arial, sans-serif">THE CALCULATOR ROOM</text>
<text x="845.0" y="824" font-size="15" fill="#3c3f47" text-anchor="start" font-weight="400" font-family="Segoe UI, Arial, sans-serif">Pure math, done by a mini-program written in C++:</text>
<text x="845.0" y="847" font-size="15" fill="#3c3f47" text-anchor="start" font-weight="400" font-family="Segoe UI, Arial, sans-serif">final grades (50% coursework + 50% exams, pass at 40),</text>
<text x="845.0" y="870" font-size="15" fill="#3c3f47" text-anchor="start" font-weight="400" font-family="Segoe UI, Arial, sans-serif">attendance eligibility (75% cutoff).</text>
<text x="845.0" y="893" font-size="15" fill="#3c3f47" text-anchor="start" font-weight="400" font-family="Segoe UI, Arial, sans-serif">Marks and dates go in - answers come out.</text>
<rect x="845.0" y="871" width="192.0" height="28" rx="6" fill="#f2f3f6" stroke="#1a1c22" stroke-opacity="0.25"/>
<text x="857.0" y="891" font-size="13" fill="#1a1c22" font-family="Consolas, monospace">cpp_module/sms_engine</text>
<path d="M 402.5,938 Q 402.5,964 710.0,968 L 742.0,972" fill="none" stroke="#b71c1c" stroke-width="2.4" marker-end="url(#arr)"/>
<path d="M 1097.5,938 Q 1097.5,964 790.0,968 L 758.0,972" fill="none" stroke="#b71c1c" stroke-width="2.4" marker-end="url(#arr)"/>
<text x="750.0" y="996" font-size="13.5" fill="#5a5e6a" text-anchor="middle" font-weight="400" font-family="Segoe UI, Arial, sans-serif">most pages visit BOTH - grab facts, then do the math on them</text>
<rect x="80" y="1008" width="1340" height="152" rx="12" fill="#ffffff" stroke="#d8d8dc" stroke-width="1.4"/>
<rect x="92" y="1008" width="1316" height="7" rx="3.5" fill="#b71c1c"/>
<circle cx="120" cy="1054" r="17" fill="#b71c1c"/>
<text x="120" y="1060" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">6</text>
<text x="150" y="1061" font-size="22" fill="#1a1c22" text-anchor="start" font-weight="700" font-family="Segoe UI, Arial, sans-serif">THE PRINTING PRESS</text>
<text x="150" y="1091" font-size="15" fill="#3c3f47" text-anchor="start" font-weight="400" font-family="Segoe UI, Arial, sans-serif">Fills a blank page template with the answers ({{name}} becomes a real name),</text>
<text x="150" y="1114" font-size="15" fill="#3c3f47" text-anchor="start" font-weight="400" font-family="Segoe UI, Arial, sans-serif">then paints it in the app's flat red-and-white style - no JavaScript anywhere.</text>
<rect x="150" y="1097" width="272.0" height="28" rx="6" fill="#f2f3f6" stroke="#1a1c22" stroke-opacity="0.25"/>
<text x="162" y="1117" font-size="13" fill="#1a1c22" font-family="Consolas, monospace">frontend/templates/ + style.css</text>
<line x1="750.0" y1="1164" x2="750.0" y2="1204" stroke="#b71c1c" stroke-width="2.6" marker-end="url(#arr)"/>
<rect x="80" y="1216" width="1340" height="128" rx="12" fill="#ffffff" stroke="#d8d8dc" stroke-width="1.4"/>
<rect x="92" y="1216" width="1316" height="7" rx="3.5" fill="#1a1c22"/>
<circle cx="120" cy="1262" r="17" fill="#1a1c22"/>
<text x="120" y="1268" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">7</text>
<text x="150" y="1269" font-size="22" fill="#1a1c22" text-anchor="start" font-weight="700" font-family="Segoe UI, Arial, sans-serif">BACK TO YOU</text>
<text x="150" y="1299" font-size="15" fill="#3c3f47" text-anchor="start" font-weight="400" font-family="Segoe UI, Arial, sans-serif">The finished page appears in your browser.</text>
<text x="150" y="1322" font-size="15" fill="#3c3f47" text-anchor="start" font-weight="400" font-family="Segoe UI, Arial, sans-serif">Every click you make runs this same loop again - in a fraction of a second.</text>
<rect x="150" y="1281" width="120.0" height="28" rx="6" fill="#f2f3f6" stroke="#1a1c22" stroke-opacity="0.25"/>
<text x="162" y="1301" font-size="13" fill="#1a1c22" font-family="Consolas, monospace">your browser</text>
<rect x="80" y="1378" width="1340" height="96" rx="10" fill="#fafafb" stroke="#5a5e6a" stroke-width="1.4" stroke-dasharray="7 5"/>
<text x="102" y="1408" font-size="15" fill="#1a1c22" text-anchor="start" font-weight="700" font-family="Segoe UI, Arial, sans-serif">BEFORE FIRST USE - one-time setup, not part of the loop</text>
<text x="102" y="1434" font-size="14" fill="#5a5e6a" text-anchor="start" font-weight="400" font-family="Segoe UI, Arial, sans-serif">setup_db.py builds the filing cabinet (creates the 11 drawers and fills them with demo data)</text>
<text x="102" y="1457" font-size="14" fill="#5a5e6a" text-anchor="start" font-weight="400" font-family="Segoe UI, Arial, sans-serif">build_cpp.py builds the calculator (compiles the C++ engine, zero warnings allowed)</text>
<rect x="80" y="1500" width="1340" height="210" rx="10" fill="#ffffff" stroke="#d8d8dc" stroke-width="1.4"/>
<rect x="92" y="1500" width="1316" height="7" rx="3.5" fill="#1a1c22"/>
<text x="104" y="1536" font-size="16" fill="#1a1c22" text-anchor="start" font-weight="700" font-family="Segoe UI, Arial, sans-serif">THE CAST - nickname in this poster, real file in the code</text>
<circle cx="109.0" cy="1561" r="4" fill="#b71c1c"/>
<text x="122.0" y="1566" font-size="14.5" fill="#1a1c22" text-anchor="start" font-weight="700" font-family="Segoe UI, Arial, sans-serif">front desk  =  </text>
<text x="237.0" y="1566" font-size="13.5" fill="#5a5e6a" text-anchor="start" font-weight="400" font-family="Consolas, monospace">backend/server.py</text>
<circle cx="789.0" cy="1561" r="4" fill="#1a1c22"/>
<text x="802.0" y="1566" font-size="14.5" fill="#1a1c22" text-anchor="start" font-weight="700" font-family="Segoe UI, Arial, sans-serif">sorting office  =  </text>
<text x="949.4" y="1566" font-size="13.5" fill="#5a5e6a" text-anchor="start" font-weight="400" font-family="Consolas, monospace">backend/routes/helpers.py</text>
<circle cx="109.0" cy="1597" r="4" fill="#b71c1c"/>
<text x="122.0" y="1602" font-size="14.5" fill="#1a1c22" text-anchor="start" font-weight="700" font-family="Segoe UI, Arial, sans-serif">page builders  =  </text>
<text x="261.3" y="1602" font-size="13.5" fill="#5a5e6a" text-anchor="start" font-weight="400" font-family="Consolas, monospace">backend/routes/*_routes.py</text>
<circle cx="789.0" cy="1597" r="4" fill="#1a1c22"/>
<text x="802.0" y="1602" font-size="14.5" fill="#1a1c22" text-anchor="start" font-weight="700" font-family="Segoe UI, Arial, sans-serif">clerks  =  </text>
<text x="884.6" y="1602" font-size="13.5" fill="#5a5e6a" text-anchor="start" font-weight="400" font-family="Consolas, monospace">backend/models/*.py</text>
<circle cx="109.0" cy="1633" r="4" fill="#b71c1c"/>
<text x="122.0" y="1638" font-size="14.5" fill="#1a1c22" text-anchor="start" font-weight="700" font-family="Segoe UI, Arial, sans-serif">the vault  =  </text>
<text x="228.89999999999998" y="1638" font-size="13.5" fill="#5a5e6a" text-anchor="start" font-weight="400" font-family="Consolas, monospace">backend/auth.py</text>
<circle cx="789.0" cy="1633" r="4" fill="#1a1c22"/>
<text x="802.0" y="1638" font-size="14.5" fill="#1a1c22" text-anchor="start" font-weight="700" font-family="Segoe UI, Arial, sans-serif">calculator  =  </text>
<text x="917.0" y="1638" font-size="13.5" fill="#5a5e6a" text-anchor="start" font-weight="400" font-family="Consolas, monospace">cpp_module/src/sms_engine.cpp</text>
<circle cx="109.0" cy="1669" r="4" fill="#b71c1c"/>
<text x="122.0" y="1674" font-size="14.5" fill="#1a1c22" text-anchor="start" font-weight="700" font-family="Segoe UI, Arial, sans-serif">filing cabinet  =  </text>
<text x="269.4" y="1674" font-size="13.5" fill="#5a5e6a" text-anchor="start" font-weight="400" font-family="Consolas, monospace">MySQL database (11 tables)</text>
<circle cx="789.0" cy="1669" r="4" fill="#1a1c22"/>
<text x="802.0" y="1674" font-size="14.5" fill="#1a1c22" text-anchor="start" font-weight="700" font-family="Segoe UI, Arial, sans-serif">the paint  =  </text>
<text x="908.9" y="1674" font-size="13.5" fill="#5a5e6a" text-anchor="start" font-weight="400" font-family="Consolas, monospace">frontend/static/css/style.css</text>
</svg>