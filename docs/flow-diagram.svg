<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1280" viewBox="0 0 1500 1280"><defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#4a4f5a"/></marker><marker id="ah2" markerWidth="9" markerHeight="9" refX="2" refY="4.5" orient="auto"><path d="M9,0 L0,4.5 L9,9 z" fill="#4a4f5a"/></marker><rect width="1500" height="1280" fill="#ffffff"/></defs><text x="40" y="46" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#2b2f3a" font-weight="bold" text-anchor="start" >How this app works — the whole story in one picture</text><text x="40" y="74" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" fill="#6b7280" font-weight="normal" text-anchor="start" >Follow the numbers ① → ⑦ : how your click becomes the page you see. No programming knowledge needed.</text><text x="40" y="96" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#6b7280" font-weight="normal" text-anchor="start" >Every box also names the real project file in small print — match it to the code whenever you're ready.</text><rect x="80" y="130" width="860" height="92" rx="10" fill="#2b2f3a" stroke="#2b2f3a" stroke-width="2"/><text x="510.0" y="163.25" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#ffffff" font-weight="bold" text-anchor="middle" >①  YOU — the visitor</text><text x="510.0" y="189.25" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#c3c8d4" font-weight="normal" text-anchor="middle" >You open the app in your browser and click a link or a button.</text><text x="510.0" y="209.25" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#c3c8d4" font-weight="normal" text-anchor="middle" >any modern browser works — nothing to install on your machine</text><path d="M 510 222 V 262" fill="none" stroke="#4a4f5a" stroke-width="2.5" marker-end="url(#ah)"/><text x="528" y="247" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#b71c1c" font-weight="bold" text-anchor="start" style="paint-order:stroke;stroke:#ffffff;stroke-width:4px">your click travels to the app</text><rect x="80" y="262" width="860" height="112" rx="10" fill="#ffffff" stroke="#2b2f3a" stroke-width="2"/><text x="510.0" y="295.75" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#2b2f3a" font-weight="bold" text-anchor="middle" >②  THE FRONT DESK</text><text x="510.0" y="321.75" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#6b7280" font-weight="normal" text-anchor="middle" >Greets every request that arrives and hands it to the right helper.</text><text x="510.0" y="341.75" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#6b7280" font-weight="normal" text-anchor="middle" >Not logged in yet? It sends you to the login page first.</text><text x="510.0" y="360.75" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#6b7280" font-weight="normal" text-anchor="middle" >backend/server.py — the program that listens for visitors</text><path d="M 510 374 V 414" fill="none" stroke="#4a4f5a" stroke-width="2.5" marker-end="url(#ah)"/><text x="528" y="399" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#b71c1c" font-weight="bold" text-anchor="start" style="paint-order:stroke;stroke:#ffffff;stroke-width:4px">“someone wants a page”</text><rect x="80" y="414" width="860" height="122" rx="10" fill="#ffffff" stroke="#2b2f3a" stroke-width="2"/><text x="510.0" y="452.75" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#2b2f3a" font-weight="bold" text-anchor="middle" >③  THE SORTING OFFICE</text><text x="510.0" y="478.75" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#6b7280" font-weight="normal" text-anchor="middle" >Reads the address of your click and picks the one worker who builds that kind of page.</text><text x="510.0" y="498.75" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#6b7280" font-weight="normal" text-anchor="middle" >8 workers: dashboard · students · courses · marks · attendance · rankings · login · style files</text><text x="510.0" y="517.75" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#6b7280" font-weight="normal" text-anchor="middle" >backend/routes/ — helpers.py does the matching</text><path d="M 300 536 V 584" fill="none" stroke="#4a4f5a" stroke-width="2.5" marker-end="url(#ah)"/><text x="318" y="565" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#b71c1c" font-weight="bold" text-anchor="start" style="paint-order:stroke;stroke:#ffffff;stroke-width:4px">④ fetch the facts</text><path d="M 720 536 V 584" fill="none" stroke="#4a4f5a" stroke-width="2.5" marker-end="url(#ah)"/><text x="738" y="565" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#b71c1c" font-weight="bold" text-anchor="start" style="paint-order:stroke;stroke:#ffffff;stroke-width:4px">⑤ run the math</text><rect x="80" y="584" width="410" height="210" rx="10" fill="#b71c1c" stroke="#b71c1c" stroke-width="2"/><text x="285.0" y="649.0" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#ffffff" font-weight="bold" text-anchor="middle" >④  THE FILING CABINET</text><text x="285.0" y="675.0" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#f3c3c9" font-weight="normal" text-anchor="middle" >Every fact the app knows lives here, in labeled drawers:</text><text x="285.0" y="694.5" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#f3c3c9" font-weight="normal" text-anchor="middle" >students · courses · who teaches what</text><text x="285.0" y="713.5" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#f3c3c9" font-weight="normal" text-anchor="middle" >who studies what · marks · attendance · grades</text><text x="285.0" y="732.5" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#f3c3c9" font-weight="normal" text-anchor="middle" >MySQL database — backend/models/ do the fetching</text><text x="285.0" y="750.0" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#f3c3c9" font-weight="normal" text-anchor="middle" >schema.sql draws the drawers · seed.sql fills them</text><rect x="530" y="584" width="410" height="210" rx="10" fill="#2b2f3a" stroke="#b71c1c" stroke-width="3"/><text x="735.0" y="649.0" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#ffffff" font-weight="bold" text-anchor="middle" >⑤  THE CALCULATOR ROOM</text><text x="735.0" y="675.0" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#c3c8d4" font-weight="normal" text-anchor="middle" >Chews through the raw marks and answers in one go:</text><text x="735.0" y="694.5" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#c3c8d4" font-weight="normal" text-anchor="middle" >final grades (50% coursework + 50% exams)</text><text x="735.0" y="713.5" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#c3c8d4" font-weight="normal" text-anchor="middle" >attendance % (eligible at 75%) · class rankings</text><text x="735.0" y="732.5" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#c3c8d4" font-weight="normal" text-anchor="middle" >a separate mini-program, written in C++</text><text x="735.0" y="750.0" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#c3c8d4" font-weight="normal" text-anchor="middle" >cpp_module/sms_engine · fed by backend/cpp_engine.py</text><text x="510" y="664" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#b71c1c" font-weight="bold" text-anchor="middle" style="paint-order:stroke;stroke:#ffffff;stroke-width:3px">marks in</text><text x="510" y="677" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#b71c1c" font-weight="bold" text-anchor="middle" style="paint-order:stroke;stroke:#ffffff;stroke-width:3px">results out</text><path d="M 492 690 H 528" fill="none" stroke="#4a4f5a" stroke-width="2.5" marker-end="url(#ah)" marker-start="url(#ah2)"/><path d="M 285 794 V 842" fill="none" stroke="#4a4f5a" stroke-width="2.5" marker-end="url(#ah)"/><path d="M 735 794 V 842" fill="none" stroke="#4a4f5a" stroke-width="2.5" marker-end="url(#ah)"/><text x="528" y="823" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#b71c1c" font-weight="bold" text-anchor="start" style="paint-order:stroke;stroke:#ffffff;stroke-width:4px">the answers come back</text><rect x="80" y="842" width="860" height="112" rx="10" fill="#ffffff" stroke="#2b2f3a" stroke-width="2"/><text x="510.0" y="885.25" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#2b2f3a" font-weight="bold" text-anchor="middle" >⑥  THE PRINTING PRESS</text><text x="510.0" y="911.25" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#6b7280" font-weight="normal" text-anchor="middle" >Fills a blank page with the answers, then paints it in the app's red-and-white style.</text><text x="510.0" y="931.25" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#6b7280" font-weight="normal" text-anchor="middle" >frontend/templates/ (page layouts) + frontend/static/css/style.css (the paint)</text><path d="M 510 954 V 994" fill="none" stroke="#4a4f5a" stroke-width="2.5" marker-end="url(#ah)"/><text x="528" y="979" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#b71c1c" font-weight="bold" text-anchor="start" style="paint-order:stroke;stroke:#ffffff;stroke-width:4px">the finished page</text><rect x="80" y="994" width="860" height="92" rx="10" fill="#2b2f3a" stroke="#2b2f3a" stroke-width="2"/><text x="510.0" y="1027.25" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#ffffff" font-weight="bold" text-anchor="middle" >⑦  BACK TO YOU</text><text x="510.0" y="1053.25" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#c3c8d4" font-weight="normal" text-anchor="middle" >The page appears in your browser — the whole loop takes a fraction of a second.</text><text x="510.0" y="1073.25" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#c3c8d4" font-weight="normal" text-anchor="middle" >every click runs this same loop again</text><rect x="80" y="1118" width="860" height="96" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6,4"/><text x="100" y="1144" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#2b2f3a" font-weight="bold" text-anchor="start" >⚙  BEFORE FIRST USE — one-time setup (already done on this machine)</text><text x="100" y="1166" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#6b7280" font-weight="normal" text-anchor="start" >python scripts/setup_db.py  →  builds the filing cabinet and fills it with demo data</text><text x="100" y="1186" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#6b7280" font-weight="normal" text-anchor="start" >python scripts/build_cpp.py  →  builds the calculator (needs the free g++ compiler)</text><text x="80" y="1250" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#6b7280" font-weight="normal" text-anchor="start" >Want the code-level version — every file and every arrow, with technical names?  See docs/FLOWCHART.md</text><rect x="990" y="130" width="460" height="800" rx="10" fill="#f6f7f9" stroke="#d9dce3" stroke-width="1.5"/><text x="1010" y="158" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#2b2f3a" font-weight="bold" text-anchor="start" >KEY — how to read this picture</text><rect x="1010" y="176" width="40" height="24" rx="6" fill="#2b2f3a" stroke="#2b2f3a" stroke-width="2"/><text x="1062" y="193" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#2b2f3a" font-weight="normal" text-anchor="start" >you — the story starts and ends here</text><rect x="1010" y="212" width="40" height="24" rx="6" fill="#ffffff" stroke="#2b2f3a" stroke-width="2"/><text x="1062" y="229" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#2b2f3a" font-weight="normal" text-anchor="start" >one program file, doing one job</text><rect x="1010" y="248" width="40" height="24" rx="6" fill="#b71c1c" stroke="#b71c1c" stroke-width="2"/><text x="1062" y="265" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#2b2f3a" font-weight="normal" text-anchor="start" >where information is stored</text><rect x="1010" y="284" width="40" height="24" rx="6" fill="#2b2f3a" stroke="#b71c1c" stroke-width="3"/><text x="1062" y="301" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#2b2f3a" font-weight="normal" text-anchor="start" >the separate calculator program</text><path d="M 1012 331 H 1048" fill="none" stroke="#4a4f5a" stroke-width="2.5" marker-end="url(#ah)"/><text x="1062" y="336" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#2b2f3a" font-weight="normal" text-anchor="start" >information moving during your click</text><path d="M 1012 367 H 1048" fill="none" stroke="#4a4f5a" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#ah)"/><text x="1062" y="372" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#2b2f3a" font-weight="normal" text-anchor="start" >one-time setup step</text><text x="1010" y="416" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#b71c1c" font-weight="bold" text-anchor="start" >THE CAST — nickname → real file</text><text x="1010" y="442" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#2b2f3a" font-weight="bold" text-anchor="start" >Front desk</text><text x="1010" y="458" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#6b7280" font-weight="normal" text-anchor="start" >backend/server.py</text><text x="1010" y="480" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#2b2f3a" font-weight="bold" text-anchor="start" >Sorting office</text><text x="1010" y="496" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#6b7280" font-weight="normal" text-anchor="start" >backend/routes/helpers.py</text><text x="1010" y="518" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#2b2f3a" font-weight="bold" text-anchor="start" >The 8 workers</text><text x="1010" y="534" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#6b7280" font-weight="normal" text-anchor="start" >backend/routes/*_routes.py</text><text x="1010" y="556" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#2b2f3a" font-weight="bold" text-anchor="start" >Filing cabinet</text><text x="1010" y="572" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#6b7280" font-weight="normal" text-anchor="start" >MySQL — see backend/db/schema.sql</text><text x="1010" y="594" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#2b2f3a" font-weight="bold" text-anchor="start" >Calculator</text><text x="1010" y="610" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#6b7280" font-weight="normal" text-anchor="start" >cpp_module/src/sms_engine.cpp</text><text x="1010" y="632" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#2b2f3a" font-weight="bold" text-anchor="start" >Printing press</text><text x="1010" y="648" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#6b7280" font-weight="normal" text-anchor="start" >frontend/templates/ + static/css/style.css</text><text x="1010" y="690" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#b71c1c" font-weight="bold" text-anchor="start" >THE 9 DRAWERS (database tables)</text><text x="1010" y="714" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#6b7280" font-weight="normal" text-anchor="start" >professors — teacher accounts</text><text x="1010" y="733" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#6b7280" font-weight="normal" text-anchor="start" >sections — the class groups (SN1, SN2)</text><text x="1010" y="752" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#6b7280" font-weight="normal" text-anchor="start" >students — the student list</text><text x="1010" y="771" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#6b7280" font-weight="normal" text-anchor="start" >courses — subjects &amp; who teaches them</text><text x="1010" y="790" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#6b7280" font-weight="normal" text-anchor="start" >enrollments — who studies what</text><text x="1010" y="809" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#6b7280" font-weight="normal" text-anchor="start" >assessments — homework &amp; exams</text><text x="1010" y="828" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#6b7280" font-weight="normal" text-anchor="start" >marks — the scores earned</text><text x="1010" y="847" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#6b7280" font-weight="normal" text-anchor="start" >grades — final results (from the calculator)</text><text x="1010" y="866" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#6b7280" font-weight="normal" text-anchor="start" >attendance — who was present</text></svg>