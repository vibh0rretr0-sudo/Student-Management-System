  <g fill="#0f172a" opacity=".6">
    <circle cx="820" cy="830" r="5"/><rect x="816" y="836" width="8" height="20" rx="4"/>
    <circle cx="905" cy="846" r="5"/><rect x="901" y="852" width="8" height="20" rx="4"/>
    <circle cx="735" cy="852" r="5"/><rect x="731" y="858" width="8" height="20" rx="4"/>
  </g>
</svg>
