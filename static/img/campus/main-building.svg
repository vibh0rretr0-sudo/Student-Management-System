    <path d="M700 300c0-82 45-142 100-142s100 60 100 142z" fill="#e4bd8d"/>
    <path d="M700 300c0-82 45-142 100-142 0 52 0 96 0 142z" fill="#c99460" opacity=".55"/>
    <rect x="787" y="118" width="26" height="48" rx="6" fill="#c99460"/>
    <circle cx="800" cy="112" r="12" fill="#e9c58f"/>
