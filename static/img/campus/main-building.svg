  <rect x="455" y="360" width="690" height="370" fill="url(#sand)"/>
  <rect x="455" y="360" width="690" height="18" fill="#f1d6b3"/>
  <rect x="455" y="378" width="690" height="10" fill="#a97448" opacity=".4"/>

