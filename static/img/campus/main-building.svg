  <g fill="#8b5e3c" opacity=".9">
    <path d="M500 520v-58a44 44 0 0 1 88 0v58z"/>
    <path d="M620 520v-58a44 44 0 0 1 88 0v58z"/>
    <path d="M892 520v-58a44 44 0 0 1 88 0v58z"/>
    <path d="M1012 520v-58a44 44 0 0 1 88 0v58z"/>
    <path d="M740 520v-76a60 60 0 0 1 120 0v76z"/>
  </g>
  <g fill="#3f2a1c" opacity=".35">
    <path d="M512 514v-52a32 32 0 0 1 64 0v52z"/>
    <path d="M632 514v-52a32 32 0 0 1 64 0v52z"/>
    <path d="M904 514v-52a32 32 0 0 1 64 0v52z"/>
    <path d="M1024 514v-52a32 32 0 0 1 64 0v52z"/>
    <path d="M752 514v-70a48 48 0 0 1 96 0v70z"/>
