<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="JECRC main academic building at sunrise">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#23406e"/>
      <stop offset=".45" stop-color="#5f7fa8"/>
      <stop offset=".75" stop-color="#e3b28a"/>
      <stop offset="1" stop-color="#f7d9ae"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8c49a"/>
      <stop offset="1" stop-color="#c99a68"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9865a"/>
      <stop offset="1" stop-color="#95663f"/>
    </linearGradient>
    <linearGradient id="lawn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f6b4b"/>
      <stop offset="1" stop-color="#24452f"/>
    </linearGradient>
    <radialGradient id="sun" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff3c9" stop-opacity=".85"/>
      <stop offset="1" stop-color="#fff3c9" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <circle cx="1190" cy="470" r="330" fill="url(#sun)"/>
  <circle cx="1190" cy="470" r="62" fill="#fff1c4" opacity=".9"/>

  <!-- distant skyline -->
  <g fill="#33507a" opacity=".55">
    <rect x="0" y="560" width="170" height="160" rx="6"/>
    <rect x="180" y="600" width="120" height="120" rx="4"/>
    <rect x="1320" y="575" width="160" height="145" rx="6"/>
    <rect x="1490" y="615" width="110" height="105" rx="4"/>
    <rect x="760" y="588" width="90" height="132" rx="4"/>
  </g>

  <!-- palms -->
  <g fill="#1d3a2c" opacity=".9">
    <rect x="1428" y="520" width="14" height="220" rx="7"/>
    <g>
      <path d="M1435 525c-40-40-88-46-118-30 34 4 62 20 84 44z"/>
      <path d="M1435 525c40-40 88-46 118-30-34 4-62 20-84 44z"/>
      <path d="M1435 522c-20-46-12-82 8-104 2 38 2 68-8 104z"/>
      <path d="M1435 522c20-46 12-82-8-104-2 38-2 68 8 104z"/>
      <path d="M1435 525c-46-20-78-12-96 6 36 0 66 0 96-6z"/>
      <path d="M1435 525c46-20 78-12 96 6-36 0-66 0-96-6z"/>
    </g>
    <rect x="160" y="585" width="11" height="155" rx="5"/>
    <g transform="translate(-4 40) scale(.8) translate(40 20)">
      <path d="M164 545c-40-40-88-46-118-30 34 4 62 20 84 44z"/>
      <path d="M164 545c40-40 88-46 118-30-34 4-62 20-84 44z"/>
      <path d="M164 542c-20-46-12-82 8-104 2 38 2 68-8 104z"/>
      <path d="M164 542c20-46 12-82-8-104-2 38-2 68 8 104z"/>
    </g>
  </g>

  <!-- rear wing -->
  <g fill="url(#shade)">
    <rect x="250" y="430" width="250" height="300" rx="6"/>
    <rect x="1100" y="430" width="250" height="300" rx="6"/>
  </g>
  <g fill="#7d5a3e" opacity=".55">
    <rect x="270" y="455" width="30" height="250" rx="14"/>
    <rect x="330" y="455" width="30" height="250" rx="14"/>
    <rect x="390" y="455" width="30" height="250" rx="14"/>
    <rect x="450" y="455" width="30" height="250" rx="14"/>
    <rect x="1120" y="455" width="30" height="250" rx="14"/>
    <rect x="1180" y="455" width="30" height="250" rx="14"/>
    <rect x="1240" y="455" width="30" height="250" rx="14"/>
    <rect x="1300" y="455" width="30" height="250" rx="14"/>
