  <g fill="#2c3f55">
    <rect x="505" y="552" width="78" height="96" rx="4"/>
    <rect x="625" y="552" width="78" height="96" rx="4"/>
    <rect x="745" y="552" width="110" height="96" rx="4"/>
    <rect x="897" y="552" width="78" height="96" rx="4"/>
    <rect x="1017" y="552" width="78" height="96" rx="4"/>
  </g>
  <g fill="#f6d9a6" opacity=".28">
    <rect x="505" y="552" width="78" height="40"/>
    <rect x="745" y="552" width="110" height="40"/>
    <rect x="1017" y="552" width="78" height="40"/>
  </g>

  <!-- entrance -->
  <rect x="735" y="640" width="130" height="90" fill="#4b3222"/>
  <rect x="745" y="650" width="110" height="80" fill="#2a1d15"/>
  <path d="M760 730v-48a40 40 0 0 1 80 0v48z" fill="#c9a072"/>
  <rect x="720" y="730" width="160" height="14" fill="#e3c49a"/>

  <!-- steps -->
  <g fill="#d4b48c">
    <rect x="640" y="744" width="320" height="12"/>
    <rect x="620" y="756" width="360" height="12"/>
    <rect x="600" y="768" width="400" height="12"/>
  </g>

