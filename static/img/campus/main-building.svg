  <g>
    <rect x="470" y="300" width="6" height="90" fill="#6b4a32"/>
    <path d="M476 306l72 18-72 18z" fill="#e08a00"/>
    <rect x="1124" y="300" width="6" height="90" fill="#6b4a32"/>
    <path d="M1124 306l-72 18 72 18z" fill="#e08a00"/>
