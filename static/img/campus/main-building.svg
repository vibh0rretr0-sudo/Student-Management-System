  <path d="M0 790c260-46 480-52 800-24 320 28 540 8 800-26v160H0z" fill="url(#lawn)"/>
  <path d="M700 790c40-8 160-10 220 0l90 110H610z" fill="#c9b18e" opacity=".75"/>
  <g fill="#1c3324">
