<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="JECRC courtyard with sandstone pavilion at golden hour">
  <defs>
    <linearGradient id="sky4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2b26b"/>
      <stop offset=".45" stop-color="#f6cf95"/>
      <stop offset="1" stop-color="#fbe7c3"/>
    </linearGradient>
    <linearGradient id="stone4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ebcba1"/>
      <stop offset="1" stop-color="#c79a6b"/>
    </linearGradient>
    <linearGradient id="shadow4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a97852"/>
      <stop offset="1" stop-color="#7d5438"/>
    </linearGradient>
    <linearGradient id="lawn4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6e8e52"/>
      <stop offset="1" stop-color="#3d5c38"/>
    </linearGradient>
    <radialGradient id="sun4" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff6d8" stop-opacity=".95"/>
      <stop offset="1" stop-color="#fff6d8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky4)"/>
  <circle cx="380" cy="250" r="280" fill="url(#sun4)"/>
  <circle cx="380" cy="250" r="54" fill="#fff8de" opacity=".9"/>

  <!-- distant buildings -->
  <g fill="#bb8f68" opacity=".55">
    <rect x="0" y="420" width="230" height="300"/>
    <rect x="1330" y="400" width="270" height="320"/>
  </g>
  <g fill="#9c6f4d" opacity=".4">
    <rect x="30" y="450" width="26" height="250" rx="13"/>
    <rect x="88" y="450" width="26" height="250" rx="13"/>
    <rect x="146" y="450" width="26" height="250" rx="13"/>
    <rect x="1370" y="430" width="26" height="260" rx="13"/>
    <rect x="1430" y="430" width="26" height="260" rx="13"/>
    <rect x="1490" y="430" width="26" height="260" rx="13"/>
  </g>

  <!-- pavilion (chhatri) -->
  <g>
    <rect x="700" y="430" width="220" height="20" fill="#f2d6ad"/>
    <rect x="700" y="450" width="220" height="12" fill="#b98860"/>
    <g fill="url(#stone4)">
      <rect x="720" y="462" width="26" height="180"/>
      <rect x="794" y="462" width="26" height="180"/>
      <rect x="868" y="462" width="26" height="180"/>
    </g>
    <g fill="#8d6244" opacity=".5">
      <rect x="746" y="462" width="48" height="180"/>
      <rect x="820" y="462" width="48" height="180"/>
    </g>
    <rect x="700" y="642" width="220" height="18" fill="#e3c095"/>
    <rect x="680" y="660" width="260" height="16" fill="#c79a6b"/>

    <!-- dome roof -->
    <path d="M660 430h300l-42-32H702z" fill="#d6a97a"/>
    <path d="M712 398c0-88 40-140 98-140s98 52 98 140z" fill="url(#stone4)"/>
    <path d="M712 398c0-88 40-140 98-140 0 52 0 96 0 140z" fill="#b4835a" opacity=".45"/>
    <rect x="798" y="232" width="24" height="40" rx="6" fill="#a97852"/>
    <circle cx="810" cy="224" r="13" fill="#f0cf9e"/>
    <g fill="#d9b184">
      <path d="M640 430l-40-22 40-14z"/>
      <path d="M980 430l40-22-40-14z"/>
    </g>
  </g>

  <!-- left block with arches -->
  <g>
    <rect x="60" y="360" width="430" height="330" fill="url(#stone4)"/>
    <rect x="60" y="360" width="430" height="16" fill="#f6ddba"/>
    <rect x="60" y="440" width="430" height="10" fill="#bb8a60" opacity=".5"/>
    <g fill="#8b5f41">
      <path d="M110 690v-110a55 55 0 0 1 110 0v110z"/>
      <path d="M260 690v-110a55 55 0 0 1 110 0v110z"/>
      <path d="M410 690v-110a55 55 0 0 1 110 0v110z"/>
    </g>
    <g fill="#4b3324" opacity=".55">
      <path d="M126 690v-100a39 39 0 0 1 78 0v100z"/>
      <path d="M276 690v-100a39 39 0 0 1 78 0v100z"/>
      <path d="M426 690v-100a39 39 0 0 1 78 0v100z"/>
    </g>
    <rect x="60" y="300" width="430" height="60" fill="#d6a97a"/>
    <rect x="80" y="270" width="390" height="30" fill="#c79a6b"/>
  </g>

  <!-- right trees -->
  <g>
    <rect x="1270" y="500" width="24" height="200" rx="10" fill="#5a4630"/>
    <g fill="#3f5f3a">
      <circle cx="1282" cy="470" r="80"/>
      <circle cx="1360" cy="500" r="60"/>
      <circle cx="1210" cy="510" r="55"/>
    </g>
    <rect x="1170" y="560" width="16" height="140" rx="8" fill="#5a4630"/>
    <g fill="#476b40">
      <circle cx="1178" cy="540" r="52"/>
      <circle cx="1230" cy="556" r="40"/>
    </g>
  </g>

  <!-- lawn -->
  <path d="M0 700h1600v200H0z" fill="url(#lawn4)"/>
  <path d="M0 700c220 30 500 40 800 20s560-30 800-10v40c-260-20-520 0-800 20s-600 8-800-18z" fill="#2f4b2f" opacity=".45"/>

  <!-- path -->
  <path d="M690 690h240l180 210H510z" fill="#d8b98f" opacity=".9"/>
  <path d="M720 720h180l96 180H624z" fill="#cbae85" opacity=".7"/>

  <!-- benches -->
  <g fill="#7b5a3d">
    <rect x="560" y="730" width="120" height="12" rx="3"/>
    <rect x="572" y="742" width="8" height="22"/>
    <rect x="660" y="742" width="8" height="22"/>
    <rect x="960" y="720" width="120" height="12" rx="3"/>
    <rect x="972" y="732" width="8" height="22"/>
    <rect x="1060" y="732" width="8" height="22"/>
  </g>

  <!-- students -->
  <g fill="#4a3a30" opacity=".85">
    <g transform="translate(620 700)">
      <circle cx="0" cy="0" r="16"/>
      <path d="M-24 80c0-32 10-48 24-48s24 16 24 48z"/>
    </g>
    <g transform="translate(690 716)">
      <circle cx="0" cy="0" r="15"/>
      <path d="M-22 74c0-30 9-45 22-45s22 15 22 45z"/>
    </g>
    <g transform="translate(980 690)">
      <circle cx="0" cy="0" r="16"/>
      <path d="M-24 80c0-32 10-48 24-48s24 16 24 48z"/>
    </g>
    <g transform="translate(1050 706)">
      <circle cx="0" cy="0" r="14"/>
      <path d="M-21 70c0-28 9-42 21-42s21 14 21 42z"/>
    </g>
  </g>

  <!-- birds -->
  <g stroke="#7a5a45" stroke-width="3" fill="none" opacity=".7">
    <path d="M1080 200c10-10 20-10 30 0 10-10 20-10 30 0"/>
    <path d="M1150 170c7-7 14-7 21 0 7-7 14-7 21 0"/>
    <path d="M1010 160c5-5 10-5 15 0 5-5 10-5 15 0"/>
  </g>

  <!-- foreground shrubs -->
  <g fill="#2f4a2c">
    <ellipse cx="150" cy="840" rx="160" ry="50"/>
    <ellipse cx="1450" cy="850" rx="180" ry="55"/>
  </g>
  <g fill="#e08a00" opacity=".7">
    <circle cx="120" cy="820" r="5"/><circle cx="200" cy="832" r="4"/>
    <circle cx="1400" cy="830" r="5"/><circle cx="1480" cy="842" r="4"/>
  </g>
</svg>
