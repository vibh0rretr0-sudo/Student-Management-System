<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Students working in the JECRC innovation lab">
  <defs>
    <linearGradient id="room3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c1b2b"/>
      <stop offset="1" stop-color="#12293f"/>
    </linearGradient>
    <linearGradient id="screen3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#79e2ff"/>
      <stop offset=".5" stop-color="#4f8cff"/>
      <stop offset="1" stop-color="#9b6bff"/>
    </linearGradient>
    <linearGradient id="desk3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#29425a"/>
      <stop offset="1" stop-color="#162636"/>
    </linearGradient>
    <radialGradient id="glow3" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#58b6ff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#58b6ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#room3)"/>

  <!-- ceiling lights -->
  <g fill="#e9f4ff" opacity=".8">
    <rect x="280" y="80" width="260" height="14" rx="7"/>
    <rect x="710" y="80" width="260" height="14" rx="7"/>
    <rect x="1140" y="80" width="260" height="14" rx="7"/>
  </g>
  <g fill="#7fc4ff" opacity=".12">
    <path d="M280 94h260l70 250H210z"/>
    <path d="M710 94h260l70 250H640z"/>
    <path d="M1140 94h260l70 250H1070z"/>
  </g>

  <!-- back wall with code panel -->
  <rect x="0" y="300" width="1600" height="320" fill="#0e2134"/>
  <g fill="#7fdcff" opacity=".35" font-family="monospace" font-size="18">
    <text x="150" y="370">def solve(matrix):</text>
    <text x="180" y="400">for row in matrix:</text>
    <text x="210" y="430">visit(row)</text>
    <text x="150" y="470"># ship it with confidence</text>
  </g>
  <g fill="#9b6bff" opacity=".35" font-family="monospace" font-size="16">
    <text x="1220" y="380">CI/CD · passing</text>
    <text x="1220" y="408">tests: 128 ✓</text>
    <text x="1220" y="436">build: 42s</text>
  </g>
  <rect x="1100" y="330" width="360" height="220" rx="10" fill="none" stroke="#2b4a67" stroke-width="2"/>

  <!-- robot arm / rover display -->
  <g>
    <rect x="620" y="430" width="120" height="80" rx="10" fill="#22384d"/>
    <circle cx="650" cy="470" r="16" fill="#68e0c4"/>
    <circle cx="710" cy="470" r="16" fill="#68b0ff"/>
    <path d="M660 430l-60-80 20-10 60 76z" fill="#3b5873"/>
    <circle cx="600" cy="345" r="14" fill="#f6c877"/>
    <path d="M800 430l30-90 16 6-26 92z" fill="#3b5873"/>
    <circle cx="836" cy="338" r="12" fill="#e08a00"/>
  </g>

  <!-- desks -->
  <g>
    <rect x="80" y="600" width="420" height="22" rx="6" fill="url(#desk3)"/>
    <rect x="600" y="600" width="420" height="22" rx="6" fill="url(#desk3)"/>
    <rect x="1120" y="600" width="400" height="22" rx="6" fill="url(#desk3)"/>
    <rect x="120" y="622" width="16" height="180" fill="#0e1a26"/>
    <rect x="440" y="622" width="16" height="180" fill="#0e1a26"/>
    <rect x="640" y="622" width="16" height="180" fill="#0e1a26"/>
    <rect x="960" y="622" width="16" height="180" fill="#0e1a26"/>
    <rect x="1160" y="622" width="16" height="180" fill="#0e1a26"/>
    <rect x="1470" y="622" width="16" height="180" fill="#0e1a26"/>
  </g>

  <!-- monitors -->
  <g>
    <rect x="160" y="480" width="280" height="120" rx="8" fill="#0b111a" stroke="#2b4a67" stroke-width="3"/>
    <rect x="168" y="488" width="264" height="104" rx="4" fill="url(#screen3)" opacity=".8"/>
    <rect x="230" y="600" width="10" height="20" fill="#243850"/>

    <rect x="680" y="470" width="300" height="130" rx="8" fill="#0b111a" stroke="#2b4a67" stroke-width="3"/>
    <rect x="688" y="478" width="284" height="114" rx="4" fill="#0f2c40"/>
    <g fill="#6ee7b7" opacity=".7" font-family="monospace" font-size="13">
      <text x="710" y="505">$ docker compose up</text>
      <text x="710" y="528">✔ portal  running</text>
      <text x="710" y="551">✔ db       healthy</text>
      <text x="710" y="574">local: http://0.0.0.0:8000</text>
    </g>
    <rect x="810" y="600" width="10" height="20" fill="#243850"/>

    <rect x="1200" y="490" width="260" height="110" rx="8" fill="#0b111a" stroke="#2b4a67" stroke-width="3"/>
    <rect x="1208" y="498" width="244" height="94" rx="4" fill="#1c1636"/>
    <g fill="#c4b5fd" opacity=".8">
      <rect x="1224" y="516" width="120" height="8" rx="4"/>
      <rect x="1224" y="534" width="180" height="8" rx="4"/>
      <rect x="1224" y="552" width="90" height="8" rx="4"/>
    </g>
    <rect x="1320" y="600" width="10" height="20" fill="#243850"/>
  </g>

  <!-- students silhouettes -->
  <g fill="#08111b">
    <g transform="translate(300 470)">
      <circle cx="0" cy="0" r="34"/>
      <path d="M-58 190c0-70 26-108 58-108s58 38 58 108z"/>
    </g>
    <g transform="translate(820 462)">
      <circle cx="0" cy="0" r="32"/>
      <path d="M-54 190c0-68 24-104 54-104s54 36 54 104z"/>
    </g>
    <g transform="translate(1340 470)">
      <circle cx="0" cy="0" r="33"/>
      <path d="M-56 190c0-70 25-106 56-106s56 36 56 106z"/>
    </g>
  </g>
  <g fill="#1a2d3e">
    <rect x="0" y="800" width="1600" height="100"/>
  </g>

  <!-- foreground glow -->
  <ellipse cx="800" cy="650" rx="500" ry="200" fill="url(#glow3)"/>
  <g fill="#0a1420" opacity=".65">
    <rect x="0" y="840" width="1600" height="60"/>
  </g>
  <g fill="#4aa3ff" opacity=".2">
    <circle cx="150" cy="820" r="4"/><circle cx="600" cy="850" r="3"/>
    <circle cx="980" cy="820" r="4"/><circle cx="1440" cy="850" r="3"/>
  </g>
</svg>
