<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="JECRC library reading hall in the evening">
  <defs>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16233d"/>
      <stop offset=".55" stop-color="#2f4b6e"/>
      <stop offset="1" stop-color="#b47c66"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5c56e" stop-opacity=".9"/>
      <stop offset=".6" stop-color="#d98f4e" stop-opacity=".75"/>
      <stop offset="1" stop-color="#7c4a35" stop-opacity=".8"/>
    </linearGradient>
    <linearGradient id="wall2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a2c2a"/>
      <stop offset="1" stop-color="#241b20"/>
    </linearGradient>
    <linearGradient id="floor2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241f28"/>
      <stop offset="1" stop-color="#12101a"/>
    </linearGradient>
    <linearGradient id="lamp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff4cf"/>
      <stop offset="1" stop-color="#f6c877" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky2)"/>
  <circle cx="1270" cy="140" r="38" fill="#f7e7c1" opacity=".9"/>
  <g fill="#0e1726" opacity=".4">
    <circle cx="1264" cy="132" r="38"/>
  </g>

  <!-- tree silhouettes -->
  <g fill="#0d1a20" opacity=".85">
    <circle cx="120" cy="540" r="110"/>
    <circle cx="250" cy="590" r="80"/>
    <circle cx="1460" cy="560" r="120"/>
    <circle cx="1330" cy="610" r="70"/>
  </g>

  <!-- building body -->
  <rect x="300" y="250" width="1000" height="430" fill="url(#wall2)"/>
  <rect x="300" y="250" width="1000" height="14" fill="#5b4440"/>
  <rect x="300" y="264" width="1000" height="6" fill="#1a1318"/>

  <!-- glass bays -->
  <g>
    <rect x="360" y="300" width="180" height="300" fill="url(#glass)"/>
    <rect x="570" y="300" width="180" height="300" fill="url(#glass)"/>
    <rect x="780" y="300" width="180" height="300" fill="url(#glass)"/>
    <rect x="990" y="300" width="180" height="300" fill="url(#glass)"/>
    <rect x="1200" y="300" width="60" height="300" fill="#31262a"/>
  </g>
  <!-- mullions -->
  <g stroke="#1b141a" stroke-width="10">
    <line x1="450" y1="300" x2="450" y2="600"/>
    <line x1="660" y1="300" x2="660" y2="600"/>
    <line x1="870" y1="300" x2="870" y2="600"/>
    <line x1="1080" y1="300" x2="1080" y2="600"/>
    <line x1="360" y1="390" x2="540" y2="390"/>
    <line x1="570" y1="390" x2="750" y2="390"/>
    <line x1="780" y1="390" x2="960" y2="390"/>
    <line x1="990" y1="390" x2="1170" y2="390"/>
  </g>

  <!-- bookshelf silhouettes behind glass -->
  <g fill="#24161a" opacity=".55">
    <rect x="500" y="420" width="190" height="180"/>
    <rect x="712" y="400" width="190" height="200"/>
    <rect x="936" y="430" width="180" height="170"/>
  </g>
  <g fill="#f0b968" opacity=".5">
    <rect x="520" y="440" width="14" height="58"/><rect x="540" y="452" width="10" height="46"/>
    <rect x="556" y="434" width="16" height="64"/><rect x="578" y="446" width="12" height="52"/>
    <rect x="596" y="438" width="14" height="60"/><rect x="618" y="456" width="10" height="42"/>
    <rect x="742" y="422" width="12" height="60"/><rect x="760" y="438" width="16" height="44"/>
    <rect x="782" y="428" width="10" height="54"/><rect x="800" y="446" width="14" height="36"/>
    <rect x="958" y="452" width="12" height="56"/><rect x="976" y="438" width="16" height="70"/>
    <rect x="998" y="460" width="10" height="48"/>
  </g>

  <!-- reading tables inside -->
  <g fill="#1d1419">
    <rect x="380" y="520" width="140" height="12" rx="3"/>
    <rect x="600" y="520" width="140" height="12" rx="3"/>
    <rect x="820" y="520" width="140" height="12" rx="3"/>
    <rect x="1040" y="520" width="140" height="12" rx="3"/>
  </g>
  <g fill="#f7d9a0" opacity=".8">
    <circle cx="410" cy="512" r="7"/><circle cx="460" cy="512" r="7"/>
    <circle cx="630" cy="512" r="7"/><circle cx="680" cy="512" r="7"/>
    <circle cx="850" cy="512" r="7"/><circle cx="900" cy="512" r="7"/>
    <circle cx="1070" cy="512" r="7"/><circle cx="1120" cy="512" r="7"/>
  </g>

  <!-- people silhouettes -->
  <g fill="#120e12">
    <circle cx="440" cy="488" r="11"/><path d="M424 520c0-14 8-22 16-22s16 8 16 22z"/>
    <circle cx="690" cy="488" r="11"/><path d="M674 520c0-14 8-22 16-22s16 8 16 22z"/>
    <circle cx="880" cy="488" r="11"/><path d="M864 520c0-14 8-22 16-22s16 8 16 22z"/>
    <circle cx="1110" cy="488" r="11"/><path d="M1094 520c0-14 8-22 16-22s16 8 16 22z"/>
  </g>

  <!-- entrance canopy -->
  <rect x="700" y="600" width="200" height="20" fill="#4a3836"/>
  <rect x="710" y="600" width="180" height="80" fill="#171118"/>
  <rect x="712" y="602" width="176" height="76" fill="url(#glass)" opacity=".6"/>
  <rect x="780" y="606" width="8" height="70" fill="#241a1d"/>

  <!-- ground -->
  <rect x="0" y="680" width="1600" height="220" fill="url(#floor2)"/>
  <path d="M600 700h400l140 200H460z" fill="#3a3036" opacity=".5"/>
  <g fill="#f7d9a0" opacity=".18">
    <ellipse cx="450" cy="760" rx="120" ry="18"/>
    <ellipse cx="690" cy="790" rx="140" ry="20"/>
    <ellipse cx="980" cy="770" rx="130" ry="18"/>
    <ellipse cx="1230" cy="810" rx="120" ry="16"/>
  </g>

  <!-- lamps -->
  <g>
    <rect x="330" y="620" width="4" height="70" fill="#322a2e"/>
    <circle cx="332" cy="618" r="12" fill="#ffe9b8"/>
    <rect x="1268" y="620" width="4" height="70" fill="#322a2e"/>
    <circle cx="1270" cy="618" r="12" fill="#ffe9b8"/>
    <rect x="1266" y="590" width="8" height="36" fill="url(#lamp)" opacity=".4"/>
  </g>

  <g fill="#0e1726" opacity=".8">
    <circle cx="90" cy="700" r="60" opacity=".5"/>
  </g>
  <path d="M0 830c220-18 420-16 640 0s520 14 960-18v88H0z" fill="#0c0a10" opacity=".7"/>
</svg>
