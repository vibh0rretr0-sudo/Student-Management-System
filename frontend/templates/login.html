<!DOCTYPE html>
<!-- Purpose: standalone login page. Session auth via POST /login; new
     sessions start on the dashboard. Kept OUTSIDE the app layout so the
     page can run its own theatrical aurora scene. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login · Student Management System</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='#c81e3c'/><text x='16' y='22.5' font-family='Segoe UI,Arial,sans-serif' font-size='17' font-weight='700' fill='#fff' text-anchor='middle'>S</text></svg>">
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="login-body">
  <div class="aurora" aria-hidden="true">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>
  <main class="login-wrap">
    <section class="login-card">
      <div class="login-brand">JECRC <span>SMS</span></div>
      <p class="login-sub">Student Management System — professor login</p>
      {{error}}
      <form method="post" action="/login">
        <label class="field">
          <span>Username</span>
          <input type="text" name="username" autocomplete="username" required autofocus>
        </label>
        <label class="field">
          <span>Password</span>
          <input type="password" name="password" autocomplete="current-password" required>
        </label>
        <button type="submit" class="btn btn-block">Log in</button>
      </form>
      <p class="login-hint">Demo account after seeding: <code>vibhor</code> / <code>prof123</code></p>
    </section>
  </main>
</body>
</html>
