<!-- Purpose: exam list + per-exam marks grids (same upsert pattern as
     assignments, without the submitted-on date). -->
<div class="page-head">
  <h2>Exams — {{course_title}}</h2>
</div>

<section class="card form-card" style="--i:0">
  <h3>New exam</h3>
  <form method="post" action="/courses/{{course_id}}/exams/new" class="row-form">
    <label class="field"><span>Title</span><input type="text" name="title" required maxlength="100"></label>
    <label class="field"><span>Max marks</span><input type="number" name="max_marks" min="0.5" step="0.5" required></label>
    <label class="field"><span>Exam date</span><input type="date" name="exam_date"></label>
    <button type="submit" class="btn">Create</button>
  </form>
</section>

<section class="card" style="--i:1">
  <h3>All exams</h3>
  <table class="data-table">
    <thead><tr><th>Title</th><th>Max</th><th>Date</th><th></th></tr></thead>
    <tbody>{{rows}}</tbody>
  </table>
</section>

{{marks_tables}}
