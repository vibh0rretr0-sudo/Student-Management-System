<!-- Purpose: section-wide rankings across ALL of a student's courses.
     One C++ rank call per section; competition ranking (1,2,2,4). -->
<div class="page-head">
  <h2>Rankings by section</h2>
</div>

<section class="card" style="--i:0">
  <p class="hint">Students ranked within their section by overall % (50% assignments + 50% exams across all enrolled courses). Computed by the C++ engine; roll number breaks ties.</p>
  <table class="data-table">
    <thead><tr><th>Rank</th><th>Roll</th><th>Student</th><th>Section</th><th>Overall %</th></tr></thead>
    <tbody>{{rows}}</tbody>
  </table>
  {{engine_note}}
</section>
