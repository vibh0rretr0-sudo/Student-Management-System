<!DOCTYPE html>
<!-- Purpose: shared app shell (sidebar, topbar, aurora, theme toggle).
     Every page renders its inner content through template.page() into
     the content placeholder — one shell, 15 inner pages. NOTE: never
     write placeholder syntax like double-brace tokens inside comments
     here; the engine substitutes every occurrence in the file. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{page_title}} · Student Management System</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='#c81e3c'/><text x='16' y='22.5' font-family='Segoe UI,Arial,sans-serif' font-size='17' font-weight='700' fill='#fff' text-anchor='middle'>S</text></svg>">
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="aurora" aria-hidden="true">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-brand">JECRC <span>SMS</span></div>
      <nav class="sidebar-nav">{{nav}}</nav>
      <div class="sidebar-foot">HTML · CSS · Python · C++ · MySQL</div>
    </aside>
    <div class="main">
      <header class="topbar">
        <h1 class="topbar-title">{{page_title}}</h1>
        <div class="topbar-right">
          <label class="theme-toggle" title="Toggle dark mode">
            <input type="checkbox" id="theme-toggle">
            <span class="toggle-ui"><span class="glyph glyph-sun">☀</span><span class="glyph glyph-moon">☾</span></span>
          </label>
          <span class="topbar-user">{{username}}</span>
        </div>
      </header>
      <main class="content">{{content}}</main>
    </div>
  </div>
</body>
</html>
