<!-- Purpose: assignment list + per-assignment marks grids. Rows carry
     the --i stagger index; marks inputs are name="marks_<student_id>"
     parsed by assessment_routes._parse_marks. -->
<div class="page-head">
  <h2>Assignments — {{course_title}}</h2>
</div>

<section class="card form-card" style="--i:0">
  <h3>New assignment</h3>
  <form method="post" action="/courses/{{course_id}}/assignments/new" class="row-form">
    <label class="field"><span>Title</span><input type="text" name="title" required maxlength="100"></label>
    <label class="field"><span>Max marks</span><input type="number" name="max_marks" min="0.5" step="0.5" required></label>
    <label class="field"><span>Due date</span><input type="date" name="due_date"></label>
    <label class="field field-wide"><span>Description</span><input type="text" name="description" maxlength="300"></label>
    <button type="submit" class="btn">Create</button>
  </form>
</section>

<section class="card" style="--i:1">
  <h3>All assignments</h3>
  <table class="data-table">
    <thead><tr><th>Title</th><th>Description</th><th>Max</th><th>Due</th><th></th></tr></thead>
    <tbody>{{rows}}</tbody>
  </table>
</section>

{{marks_tables}}
