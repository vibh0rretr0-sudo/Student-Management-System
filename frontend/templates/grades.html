<!-- Purpose: C++-computed grades for one course. The owner's visit
     persists the rows into the grades table (dashboard feed). -->
<div class="page-head">
  <h2>Grades — {{course_title}}</h2>
</div>

<section class="card" style="--i:0">
  <p class="hint">Final % = 50% assignment average + 50% exam average; missing marks count as zero; Pass at 40% or above. Computed by the C++ engine; saving stores results in the <code>grades</code> table for professors.</p>
  <table class="data-table">
    <thead><tr><th>Roll</th><th>Student</th><th>Assignments</th><th>Exams</th><th>Final %</th><th>Result</th></tr></thead>
    <tbody>{{rows}}</tbody>
  </table>
  {{engine_note}}
</section>
<a class="btn btn-ghost" href="{{back_link}}">Back to course</a>
