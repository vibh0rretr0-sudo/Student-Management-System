<!-- Purpose: add/edit course form (one template, two flows — the action
     placeholder carries the POST target). The weekly slot fields feed
     the professor double-booking check (courses._ensure_professor_free). -->
<section class="card form-card" style="--i:0">
  <h2>{{form_title}}</h2>
  <form method="post" action="{{action}}">
    <label class="field">
      <span>Course name</span>
      <input type="text" name="course_name" value="{{name_value}}" required maxlength="100">
    </label>
    <label class="field">
      <span>Course code</span>
      <input type="text" name="course_code" value="{{code_value}}" required maxlength="20">
      <small>e.g. CS101 — unique per section.</small>
    </label>
    <label class="field">
      <span>Venue</span>
      <input type="text" name="venue" value="{{venue_value}}" maxlength="50" placeholder="e.g. NYB-314">
      <small>Room from the timetable — left blank, it's stored as TBA.</small>
    </label>
    <label class="field">
      <span>Section</span>
      <select name="section_id" required>{{section_options}}</select>
    </label>
    <label class="field">
      <span>Term</span>
      <input type="text" name="term" value="{{term_value}}" required maxlength="20">
    </label>
    <label class="field">
      <span>Day of week</span>
      <select name="day_of_week" required>{{day_options}}</select>
    </label>
    <label class="field">
      <span>Start time</span>
      <input type="time" name="start_time" value="{{start_value}}" required>
    </label>
    <label class="field">
      <span>End time</span>
      <input type="time" name="end_time" value="{{end_value}}" required>
      <small>You cannot teach overlapping slots in the same batch.</small>
    </label>
    <div class="form-actions">
      <button type="submit" class="btn">Save</button>
      <a class="btn btn-ghost" href="{{cancel_link}}">Cancel</a>
    </div>
  </form>
</section>
