<!-- Purpose: searchable, filterable student list. Filters are GET-form
     fields (q, course_id, section_id), so every filtered view is a
     plain bookmarkable URL. -->
<div class="page-head">
  <form method="get" action="/students" class="filter-bar">
    <input type="text" name="q" value="{{q}}" placeholder="Search name or roll number…" class="search-input">
    <select name="course_id">{{course_options}}</select>
    <select name="section_id">{{section_options}}</select>
    <button type="submit" class="btn">Filter</button>
  </form>
  <div class="head-actions">
    <a class="btn" href="/students/new">+ Add student</a>
    <a class="btn btn-ghost" href="/students/bulk">+ Bulk add (15)</a>
  </div>
</div>

<section class="card" style="--i:1">
  <table class="data-table">
    <thead>
      <tr><th>Roll</th><th>Name</th><th>Section</th><th>Contact</th><th>Enrolled</th><th></th></tr>
    </thead>
    <tbody>{{rows}}</tbody>
  </table>
</section>
