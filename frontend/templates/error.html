<!-- Purpose: one template for every error (400/403/404/405/500) —
     dispatch() and the route helpers fill status/title/message. -->
<section class="card error-card" style="--i:0">
  <p class="error-status">{{status}}</p>
  <h2>{{title}}</h2>
  <p>{{message}}</p>
  <p><a class="btn" href="{{back_link}}">Go back</a></p>
</section>
