<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{{ status }} · {{ title }} · JECRC Portal</title>
  {% include "partials/theme-init.html" %}
  <link rel="icon" type="image/svg+xml" href="/static/img/favicon.svg">
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/components.css">
</head>
<body>
  <div class="standalone">
    <header class="standalone__top">
      <a class="brand" href="/" aria-label="JECRC portal home">
        <img src="/static/img/logo.png" alt="JECRC Logo" class="brand__logo-img">
        <span class="brand__text">
          <span class="brand__sub">Student &amp; Faculty Portal</span>
        </span>
      </a>
      {% include "partials/theme-toggle.html" %}
    </header>

    <main class="standalone__main">
      <div class="error-card">
        <div class="error-card__icon" aria-hidden="true">
          <svg class="icon" viewBox="0 0 24 24">
            {% if status == 404 %}
            <circle cx="11" cy="11" r="7"></circle>
            <path d="m20 20-3.2-3.2"></path>
            {% else %}
            <path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"></path>
            <path d="M12 9v4M12 17h.01"></path>
            {% endif %}
          </svg>
        </div>
        <span class="error-card__code">Error {{ status }}</span>
        <h1>{{ title }}</h1>
        <p>{{ message }}</p>
        <div class="error-card__actions">
          <button class="btn btn--primary" type="button" data-retry>
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 12a9 9 0 1 0 3-6.7L3 8"></path>
              <path d="M3 3v5h5"></path>
            </svg>
            Try again
          </button>
          <a class="btn btn--secondary" href="/">Back to sign in</a>
        </div>
      </div>
    </main>

    <footer class="standalone__foot">
      © 2026 JECRC, Jaipur · Student &amp; Faculty Portal
    </footer>
  </div>
  <script type="module" src="/static/js/pages/standalone.js"></script>
</body>
</html>
